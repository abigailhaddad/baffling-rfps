[project]
name = "baffling-rfps"
version = "0.1.0"
description = "The most baffling new federal contracting posting on SAM.gov each week, found by Claude, with every quote checked"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
